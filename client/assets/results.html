<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Results</title>
  <link rel="stylesheet" href="./Styles/resultstyle.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div>#Game Results</div>
    <div><strong>Brain Bank Heist</strong></div>
    <div>Six-Seven Quizzes</div>
  </div>

  <!-- Main Section -->
  <div class="main" id="main-container">

    <!-- Result Card -->
    <div class="card">
      
      <h1 id="result-title">Loading...</h1>

      <div id="result-score">0/0</div>

      <p id="result-message">
        Please wait while we load your results...
      </p>

      <div class="buttons">
        <button onclick="playAgain()">Play Again</button>
        <button onclick="goHome()">Return to HomePage</button>
      </div>

    </div>

  </div>

  <!-- Footer -->
  <div class="footer"> copyright @2026 Brain Bank Heist | Six-Seven Quizzes |</div>

  <script src="./scripts/scripts.js"></script>
</body>
</html>
